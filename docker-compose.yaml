services:
  rabbitmq:
    build:
      context: ./src/services/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=gateway
      - PORT=5000
      - JOBS=5
      - MOM_HOST=rabbitmq
      - GATEWAY_PREFIX=gateway
      - FILTER_OUTPUT_QUEUE=filter_queue
      - WORD_READER_OUTPUT_QUEUE=word_reader_queue
    ports:
      - 5000:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_0:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_0
    environment:
      - PYTHONUNBUFFERED=1
      - ID=0
      - FILTER_AMOUNT=1
      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=filter
      - GATEWAY_PREFIX=gateway
      - FILTER_INPUT_QUEUE=filter_queue
      - IMAGE_DOWNLOADER_OUTPUT_QUEUE=image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    profiles: ["client"]
    environment:
      INPUT_FILE: /app/input/articles.csv
      SERVER_HOST: gateway
      SERVER_PORT: "5000"
      BATCH_SIZE: "100"
    volumes:
      - ./input:/app/input:ro
    depends_on:
      gateway:
        condition: service_healthy
  download:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    profiles: ["data"]
    entrypoint: ["python", "scripts/download_dataset.py"]
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-5}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      MAX_ROWS: ${MAX_ROWS:-0}
    volumes:
      - ./input:/app/input
      - kaggle-cache:/cache/kagglehub
volumes:
  kaggle-cache:
