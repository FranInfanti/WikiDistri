services:
  rabbitmq:
    build:
      context: ./src/services/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    environment:
      - HOST=localhost
      - PORT=5000
      - MOM_HOST=rabbitmq
      - FILTER_OUTPUT_QUEUE=filter_output_queue
      - WORD_READER_OUTPUT_QUEUE=word_reader_output_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
