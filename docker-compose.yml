services:
  dataset-downloader:
    build:
      context: .
      dockerfile: ./src/services/client/Dockerfile
    profiles:
    - data-setup
    container_name: dataset-downloader
    entrypoint:
    - python
    - scripts/download_dataset.py
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-5}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      MAX_ROWS: ${MAX_ROWS:-0}
    volumes:
    - ./input:/app/input
    - kaggle-cache:/cache/kagglehub
  rabbitmq:
    build:
      context: ./src/services/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - "5672:5672"
      - "15672:15672"
  gateway:
    build:
      context: ./src/
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    environment:
      PYTHONUNBUFFERED: '1'
      HOST: gateway
      PORT: "5000"
      JOBS: 5
      BATCH_SIZE: "50"
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_QUEUE: filter_queue
      WORD_READER_QUEUE: word_reader_queue
    ports:
    - 5000:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
  image_downloader_0:
    build:
      context: ./src/
      dockerfile: services/downloader/Dockerfile
    container_name: image_downloader_0
    environment:
      PYTHONUNBUFFERED: '1'
      ID: '0'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      IMAGE_DOWNLOADER_AMOUNT: '1'
      IMAGE_DOWNLOADER_PREFIX: image_downloader
      IMAGE_DOWNLOADER_QUEUE: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  client_0:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    container_name: client_0
    environment:
      PYTHONUNBUFFERED: '1'
      INPUT_FILE: /app/input/articles.csv
      SERVER_HOST: gateway
      SERVER_PORT: '5000'
      BATCH_SIZE: '100'
    volumes:
    - ./input:/app/input:ro
    - ./output:/app/output
    depends_on:
      gateway:
        condition: service_started
  filter_0:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_0
    environment:
      PYTHONUNBUFFERED: "1"
      ID: "0"
      FILTER_AMOUNT: "3"
      MOM_HOST: rabbitmq
      FILTER_PREFIX: filter
      GATEWAY_PREFIX: gateway
      FILTER_INPUT_QUEUE: filter_queue
      IMAGE_DOWNLOADER_OUTPUT_QUEUE: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_1:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_1
    environment:
      PYTHONUNBUFFERED: "1"
      ID: "1"
      FILTER_AMOUNT: "3"
      MOM_HOST: rabbitmq
      FILTER_PREFIX: filter
      GATEWAY_PREFIX: gateway
      FILTER_INPUT_QUEUE: filter_queue
      IMAGE_DOWNLOADER_OUTPUT_QUEUE: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_2:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_2
    environment:
      PYTHONUNBUFFERED: "1"
      ID: "2"
      FILTER_AMOUNT: "3"
      MOM_HOST: rabbitmq
      FILTER_PREFIX: filter
      GATEWAY_PREFIX: gateway
      FILTER_INPUT_QUEUE: filter_queue
      IMAGE_DOWNLOADER_OUTPUT_QUEUE: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  word_reader_0:
    build:
      context: ./src/
      dockerfile: services/reader/Dockerfile
    container_name: word_reader_0
    environment:
      MOM_HOST: rabbitmq
      WORD_READER_OUTPUT_QUEUE: word_reader_queue
      WORD_READER_PREFIX: word_reader
      WORD_READER_AMOUNT: "4"
      ID: "0"
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      JOIN_QUEUE: join_queue
      SUM_AMOUNT_QUEUE: sum_amount_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  word_reader_1:
    build:
      context: ./src/
      dockerfile: services/reader/Dockerfile
    container_name: word_reader_1
    environment:
      MOM_HOST: rabbitmq
      WORD_READER_OUTPUT_QUEUE: word_reader_queue
      WORD_READER_PREFIX: word_reader
      WORD_READER_AMOUNT: "4"
      ID: "1"
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      JOIN_QUEUE: join_queue
      SUM_AMOUNT_QUEUE: sum_amount_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  word_reader_2:
    build:
      context: ./src/
      dockerfile: services/reader/Dockerfile
    container_name: word_reader_2
    environment:
      MOM_HOST: rabbitmq
      WORD_READER_OUTPUT_QUEUE: word_reader_queue
      WORD_READER_PREFIX: word_reader
      WORD_READER_AMOUNT: "4"
      ID: "2"
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      JOIN_QUEUE: join_queue
      SUM_AMOUNT_QUEUE: sum_amount_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  word_reader_3:
    build:
      context: ./src/
      dockerfile: services/reader/Dockerfile
    container_name: word_reader_3
    environment:
      MOM_HOST: rabbitmq
      WORD_READER_OUTPUT_QUEUE: word_reader_queue
      WORD_READER_PREFIX: word_reader
      WORD_READER_AMOUNT: "4"
      ID: "3"
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      JOIN_QUEUE: join_queue
      SUM_AMOUNT_QUEUE: sum_amount_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  sum_0:
    build:
      context: ./src/
      dockerfile: services/sum_count/Dockerfile
    container_name: sum_0
    environment:
      MOM_HOST: rabbitmq
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      SUM_COUNT_PREFIX: sum_count
      COORDINATOR_ID: "0"
      GATEWAY_PREFIX: gateway
      CHUNK_SIZE: "1000"
      ID: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy
  sum_1:
    build:
      context: ./src/
      dockerfile: services/sum_count/Dockerfile
    container_name: sum_1
    environment:
      MOM_HOST: rabbitmq
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      SUM_COUNT_PREFIX: sum_count
      COORDINATOR_ID: "0"
      GATEWAY_PREFIX: gateway
      CHUNK_SIZE: "1000"
      ID: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
  sum_2:
    build:
      context: ./src/
      dockerfile: services/sum_count/Dockerfile
    container_name: sum_2
    environment:
      MOM_HOST: rabbitmq
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      SUM_COUNT_PREFIX: sum_count
      COORDINATOR_ID: "0"
      GATEWAY_PREFIX: gateway
      CHUNK_SIZE: "1000"
      ID: "2"
    depends_on:
      rabbitmq:
        condition: service_healthy
  sum_3:
    build:
      context: ./src/
      dockerfile: services/sum_count/Dockerfile
    container_name: sum_3
    environment:
      MOM_HOST: rabbitmq
      SUM_WORDS_QUEUE_PREFIX: sum_words_queue
      SUM_WORDS_COUNT: "4"
      SUM_COUNT_PREFIX: sum_count
      COORDINATOR_ID: "0"
      GATEWAY_PREFIX: gateway
      CHUNK_SIZE: "1000"
      ID: "3"
    depends_on:
      rabbitmq:
        condition: service_healthy
  download:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    container_name: download
    profiles: ["data-setup"]
    entrypoint: ["python", "scripts/download_dataset.py"]
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-5}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      MAX_ROWS: ${MAX_ROWS:-0}
    volumes:
      - ./input:/app/input
      - kaggle-cache:/cache/kagglehub
volumes:
  kaggle-cache: null
