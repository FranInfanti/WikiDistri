services:
  dataset-downloader:
    build:
      context: .
      dockerfile: ./src/services/client/Dockerfile
    profiles:
    - data-setup
    container_name: dataset-downloader
    entrypoint:
    - python
    - scripts/download_dataset.py
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-5}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      MAX_ROWS: ${MAX_ROWS:-0}
    volumes:
    - ./input:/app/input
    - kaggle-cache:/cache/kagglehub
  rabbitmq:
    build:
      context: ./src/services/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    environment:
      PYTHONUNBUFFERED: '1'
      HOST: gateway
      PORT: '5000'
      JOBS: '5'
      BATCH_SIZE: '50'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_QUEUE: filter_queue
      WORD_READER_QUEUE: word_reader_queue
    ports:
    - 5000:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
  download:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    container_name: download
    profiles:
    - data-setup
    entrypoint:
    - python
    - scripts/download_dataset.py
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-5}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      MAX_ROWS: ${MAX_ROWS:-0}
    volumes:
    - ./input:/app/input
    - kaggle-cache:/cache/kagglehub
  filter_0:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_0
    environment:
      PYTHONUNBUFFERED: '1'
      ID: '0'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_AMOUNT: '3'
      FILTER_PREFIX: filter
      FILTER_QUEUE: filter_queue
      IMAGE_DOWNLOADER_QUEUE: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_1:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_1
    environment:
      PYTHONUNBUFFERED: '1'
