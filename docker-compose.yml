services:
  dataset-downloader:
    build:
      context: .
      dockerfile: ./src/services/client/Dockerfile
    profiles:
    - data-setup
    container_name: dataset-downloader
    entrypoint:
    - python
    - scripts/download_dataset.py
    environment:
      FILES_PER_LANGUAGE: ${FILES_PER_LANGUAGE:-1}
      WIKI_LANGUAGES: ${WIKI_LANGUAGES:-en,fr}
      DOWNLOAD_DIR: /app/input/data
    volumes:
    - ./input:/app/input
  notebook:
    build:
      context: .
      dockerfile: ./src/notebook/Dockerfile
    profiles:
    - notebook
    container_name: notebook
    environment:
      PYTHONUNBUFFERED: '1'
      PER_LANGUAGE_SAMPLE_AMOUNT: '1'
      INPUT_DIR: /app/input/data
      OUTPUT_DIR: /app/output
    volumes:
    - ./input:/app/input
    - ./output:/app/output
  rabbitmq:
    build:
      context: ./src/services/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: INFO
      HOST: gateway
      PORT: '5000'
      JOBS: '1'
      BATCH_SIZE: '1000'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_INSTANCES: '3'
      FILTER_QUEUE: filter_queue
      WORD_READER_INSTANCES: '4'
      WORD_READER_QUEUE: word_reader_queue
    ports:
    - 5000:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_0:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_0
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: INFO
      ID: '0'
      BATCH_SIZE: '1000'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_INSTANCES: '3'
      FILTER_PREFIX: filter
      FILTER_QUEUE_PREFIX: filter_queue
      IMAGE_DOWNLOADER_INSTANCES: '3'
      IMAGE_DOWNLOADER_PREFIX: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_1:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_1
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: INFO
      ID: '1'
      BATCH_SIZE: '1000'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_INSTANCES: '3'
      FILTER_PREFIX: filter
      FILTER_QUEUE_PREFIX: filter_queue
      IMAGE_DOWNLOADER_INSTANCES: '3'
      IMAGE_DOWNLOADER_PREFIX: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  filter_2:
    build:
      context: ./src/
      dockerfile: services/filter/Dockerfile
    container_name: filter_2
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: '1'
      LOG_LEVEL: INFO
      ID: '2'
      BATCH_SIZE: '1000'
      MOM_HOST: rabbitmq
      GATEWAY_PREFIX: gateway
      FILTER_INSTANCES: '3'
      FILTER_PREFIX: filter
      FILTER_QUEUE_PREFIX: filter_queue
      IMAGE_DOWNLOADER_INSTANCES: '3'
      IMAGE_DOWNLOADER_PREFIX: image_downloader_queue
    depends_on:
      rabbitmq:
        condition: service_healthy
  client_0:
    build:
      context: .
      dockerfile: src/services/client/Dockerfile
    profiles:
    - client
    container_name: client_0
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: '1'
      CLIENT_ID: client_0
      INPUT_DIR: /app/input/data
      OUTPUT_DIR: /app/output
      FILES_PER_LANGUAGE: '2'
      WIKI_LANGUAGES: en,fr
      MAX_ROWS: '0'
      SERVER_HOST: gateway
      SERVER_PORT: '5000'
      BATCH_SIZE: '1000'
      PARQUET_BATCH_SIZE: '2000'
    volumes:
    - ./input:/app/input
    - ./output:/app/output
    depends_on:
      gateway:
        condition: service_started
